# Include inside the existing HTTPS server for the installation site's domain.
# Old installation entry points now open the approved public TestFlight beta.
# Exact matches preserve the archived IPA, manifest and other release assets.
location = /ios-install { return 302 https://testflight.apple.com/join/BJrMV91r; }
location = /ios-install/ { return 302 https://testflight.apple.com/join/BJrMV91r; }
location = /ios-install/1.0.10-34-a59a4d4f403da8f90d3a1c600d10132b/ { return 302 https://testflight.apple.com/join/BJrMV91r; }
location = /ios-install/1.0.10-34-a59a4d4f403da8f90d3a1c600d10132b/index.html { return 302 https://testflight.apple.com/join/BJrMV91r; }

location ^~ /ios-install/ {
    alias /var/lib/eos3-wallet-ios/public/;
    index index.html;
    autoindex off;
    disable_symlinks on;
    types {
        text/html html;
        text/css css;
        text/xml plist;
        image/png png;
        application/octet-stream ipa;
    }
    default_type application/octet-stream;
    add_header Cache-Control "private, no-store, no-transform" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
}
