# Include inside the existing wallet.eos3.app HTTPS server block.
# Keep legal documents outside the rotating website release directory.
location = /privacy {
    return 308 /privacy/;
}

location ^~ /privacy/ {
    alias /var/lib/eos3-wallet-legal/privacy/;
    index index.html;
    autoindex off;
    disable_symlinks on;
    charset utf-8;
    types {
        text/html html;
        text/css css;
    }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=300, no-transform" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}
