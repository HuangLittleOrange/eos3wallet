name: Public Android APK
run-name: Android APK from main @ ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_CERTIFICATE_SHA256: 760400107cc85ff86312473f854fe5fc5ff9e4237cdc280f07bfe4230628750a

concurrency:
  group: public-android-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  reserve-release-tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No checkout, wallet code, dependency execution, signing secrets or OIDC.
      # Reserve the immutable source tag while this commit is still main HEAD.
      # A tag alone is not a release: publication still waits for all checks.
      - name: Verify tag permissions and reserve this run's source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo, commit = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          if os.environ['GITHUB_REF'] != 'refs/heads/main' or os.environ['REPOSITORY_PRIVATE'] != 'false' or os.environ['GITHUB_EVENT_NAME'] not in ('push', 'workflow_dispatch') or not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo) or not re.fullmatch('[a-f0-9]{40}', commit) or not re.fullmatch('[0-9]+', run_id) or not re.fullmatch('[0-9]+', attempt):
              raise SystemExit('Invalid public main source context')
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)
          head = json.loads(gh('api', f'repos/{repo}/git/ref/heads/main'))
          if head['object']['type'] != 'commit' or head['object']['sha'] != commit:
              raise SystemExit('Main advanced before tag reservation; no compilation was started')
          tag = f'android-prerelease-{commit}-{run_id}-{attempt}'
          endpoint = f'repos/{repo}/git/ref/tags/{tag}'
          result = subprocess.run(['gh', 'api', endpoint], capture_output=True, text=True)
          if result.returncode:
              if 'HTTP 404' not in result.stderr:
                  raise SystemExit(result.stderr)
              gh('api', '--method', 'POST', f'repos/{repo}/git/refs', '-f', f'ref=refs/tags/{tag}', '-f', f'sha={commit}')
          reference = json.loads(gh('api', endpoint))
          if reference['object']['type'] != 'commit' or reference['object']['sha'] != commit:
              raise SystemExit('Reserved source tag mismatch')
          print(f'Reserved {tag}; no APK or release has been published')
          PY

  build:
    needs: reserve-release-tag
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Require a public repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$REPOSITORY_PRIVATE" = false || { echo 'Use a public repository for public build records and attestations.'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Adoptium SemVer for the Temurin 17.0.20.1+1 release.
          java-version: '17.0.20+101'
      # Downloads only. No compiled outputs, node_modules or signing materials.
      - name: Restore public dependency downloads
        id: public-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, pinned
        with:
          path: |
            .codex/native-build-cache/gradle-9.3.1-bin.zip
            .codex/native-build-cache/modules-2
            .codex/native-build-cache/npm-cache/_cacache
          key: android-public-downloads-v1-${{ runner.os }}-${{ runner.arch }}-node22.23.2-java17.0.20-101-${{ hashFiles('package.json', 'package-lock.json', 'native-build-policy.json', 'dependency-policy.json', 'app.json', 'patches/**', 'scripts/native-android-worker.cjs', 'scripts/native-install.cjs') }}
      - name: Discard a non-exact cache match
        if: steps.public-cache.outputs.cache-hit != 'true'
        run: rm -rf .codex/native-build-cache
      - name: Install reviewed Android SDK components
        run: node scripts/github-android.cjs sdk
      - name: Prepare public dependencies inside the credential-free sandbox
        timeout-minutes: 30
        run: node scripts/build-android-isolated.cjs --prepare-cache
      # Save after successful preparation, even if the subsequent build fails.
      - name: Save public dependency downloads
        if: steps.public-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, pinned
        with:
          path: |
            .codex/native-build-cache/gradle-9.3.1-bin.zip
            .codex/native-build-cache/modules-2
            .codex/native-build-cache/npm-cache/_cacache
          key: ${{ steps.public-cache.outputs.cache-primary-key }}
      - name: Build unsigned APK offline and run tests
        id: native
        run: node scripts/build-android-isolated.cjs --unsigned-only
      - name: Record source commit, file hashes and toolchain
        env:
          NATIVE_OUTPUT: ${{ steps.native.outputs.native_output }}
        run: node scripts/github-android.cjs package-build "$NATIVE_OUTPUT" exports/github-unsigned
      - name: Upload unsigned APK and public build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: exports/github-unsigned/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Preserve failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-failed-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            exports/native-review/*/java-version.txt
            exports/native-review/*/sandbox-probe.txt
            exports/native-review/*/install.txt
            exports/native-review/*/cache.txt
            exports/native-review/*/build.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload source license texts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-licenses-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            third-party/
            docs/dependency-security.md
          if-no-files-found: error
          retention-days: 90

  release-sign:
    needs: build
    environment: android-production-signing
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      # Fresh VM, no app source, node_modules or Gradle code in this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/github-android.cjs
            /scripts/sign-android-release.cjs
            /scripts/release-signing-worker.cjs
            /android-signing-policy.json
            /docs/android-release-certificate.der
            /scripts/native-sandbox.cjs
            /native-build-policy.json
            /.gitignore
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Adoptium SemVer for the Temurin 17.0.20.1+1 release.
          java-version: '17.0.20+101'
      - name: Install reviewed signing tools
        run: node scripts/github-android.cjs sign-sdk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: exports/github-input
          digest-mismatch: error
      - name: Verify unsigned evidence and sign in an independent offline sandbox
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        run: node scripts/github-android.cjs sign exports/github-input exports/github-signed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: exports/github-signed/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  attest:
    needs: [build, release-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Never check out or execute repository scripts in the OIDC-enabled job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/unsigned
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/signed
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-licenses-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/legal
          digest-mismatch: error
      - name: Verify artifacts and source binding before issuing provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil
          base = pathlib.Path(os.environ['RUNNER_TEMP'])
          unsigned = base / 'evidence/unsigned'
          signed = base / 'evidence/signed'
          legal = base / 'evidence/legal'
          output = base / 'public-apk'
          output.mkdir()
          unsigned_names = ['wallet-review-unsigned.apk', 'build-info.json', 'source-manifest.json', 'verification.json', 'java-version.txt', 'sandbox-probe.txt', 'install.txt', 'build.txt', 'LICENSE', 'THIRD_PARTY_NOTICES.md']
          signed_names = ['wallet-release.apk', 'wallet-release.apk.json', 'sign-info.json', 'android-signing-policy.json', 'android-release-certificate.der']
          def digest(file):
              if file.is_symlink() or not file.is_file():
                  raise SystemExit('Artifact must be a regular file')
              hasher = hashlib.sha256()
              with file.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      hasher.update(chunk)
              return hasher.hexdigest()
          for directory, names in [(unsigned, unsigned_names), (signed, signed_names)]:
              expected = ''.join(f'{digest(directory / name)}  {name}\n' for name in names)
              checksum_file = directory / 'SHA256SUMS'
              digest(checksum_file)
              if checksum_file.read_text() != expected:
                  raise SystemExit('SHA256 or artifact inventory mismatch')
          build = json.loads((unsigned / 'build-info.json').read_text())
          sign = json.loads((signed / 'sign-info.json').read_text())
          proof = json.loads((signed / 'wallet-release.apk.json').read_text())
          expected = {'repository': os.environ['GITHUB_REPOSITORY'], 'ref': 'refs/heads/main', 'commit': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT']}
          if os.environ['GITHUB_REF'] != expected['ref']:
              raise SystemExit('Only main builds may receive this provenance')
          for metadata in [build, sign]:
              if any(metadata.get(key) != value for key, value in expected.items()):
                  raise SystemExit('Source or workflow context mismatch')
          if build.get('productionSigning') is not False or sign.get('productionSigning') is not True or proof.get('productionSigning') is not True:
              raise SystemExit('Release signing mode mismatch')
          unsigned_hash = digest(unsigned / unsigned_names[0])
          signed_hash = digest(signed / signed_names[0])
          if build.get('sha256') != unsigned_hash or sign.get('sha256') != signed_hash or sign.get('unsignedSha256') != unsigned_hash:
              raise SystemExit('APK metadata mismatch')
          if proof.get('unsignedSha256') != unsigned_hash or proof.get('signedSha256') != signed_hash or proof.get('signatureVerified') is not True or proof.get('alignment16KbVerified') is not True:
              raise SystemExit('Signature verification missing')
          if not re.fullmatch('[a-fA-F0-9]{64}', proof.get('certificateSha256', '')) or proof.get('certificateSha256') != sign.get('certificateSha256'):
              raise SystemExit('Certificate fingerprint mismatch')
          policy = json.loads((signed / 'android-signing-policy.json').read_text())
          pinned = os.environ['RELEASE_CERTIFICATE_SHA256']
          if not re.fullmatch('[a-f0-9]{64}', pinned) or policy.get('certificateSha256') != pinned or proof.get('certificateSha256') != pinned or digest(signed / 'android-release-certificate.der') != pinned or sign.get('signingPolicySha256') != digest(signed / 'android-signing-policy.json') or proof.get('signingPolicySha256') != sign.get('signingPolicySha256'):
              raise SystemExit('Pinned release certificate mismatch')
          if build.get('sourceManifestSha256') != digest(unsigned / 'source-manifest.json'):
              raise SystemExit('Source manifest metadata mismatch')
          manifest = json.loads((unsigned / 'source-manifest.json').read_text())['files']
          if manifest.get('android-signing-policy.json') != digest(signed / 'android-signing-policy.json') or manifest.get('docs/android-release-certificate.der') != pinned:
              raise SystemExit('Release policy differs from compiled source')
          license_names = sorted(name for name in manifest if name.startswith('third-party/') or name == 'docs/dependency-security.md')
          if not license_names:
              raise SystemExit('Source license inventory missing')
          for name in license_names:
              relative = pathlib.PurePosixPath(name)
              file = legal / name
              if relative.is_absolute() or '..' in relative.parts or legal.resolve() not in file.resolve().parents:
                  raise SystemExit('Unsafe license path')
              if digest(file) != manifest[name]:
                  raise SystemExit('License differs from compiled source')
          for name in license_names:
              target = output / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(legal / name, target)
          for directory, names in [(unsigned, unsigned_names), (signed, signed_names)]:
              for name in names:
                  shutil.copyfile(directory / name, output / name)
          PY
      - name: Attest APKs and source evidence with GitHub OIDC
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/public-apk/wallet-review-unsigned.apk
            ${{ runner.temp }}/public-apk/wallet-release.apk
            ${{ runner.temp }}/public-apk/build-info.json
            ${{ runner.temp }}/public-apk/sign-info.json
            ${{ runner.temp }}/public-apk/source-manifest.json
      - name: Publish SHA256, provenance bundle and verification instructions
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, shutil
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'public-apk'
          shutil.copyfile(os.environ['ATTESTATION_BUNDLE'], output / 'provenance.jsonl')
          lines = []
          for file in sorted(output.rglob('*')):
              if file.is_dir():
                  continue
              hasher = hashlib.sha256()
              with file.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      hasher.update(chunk)
              lines.append(f"{hasher.hexdigest()}  {file.relative_to(output).as_posix()}\n")
          (output / 'SHA256SUMS').write_text(''.join(lines))
          repo, commit = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          source = f'https://github.com/{repo}/tree/{commit}'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### Public Android build\n\nSource: [main commit `{commit}`]({source})\n\n')
              summary.write('Fixed release certificate signing in an independent offline sandbox; distributed as a prerelease.\n\n')
              summary.write('```text\n' + ''.join(line for line in lines if line.rstrip().endswith('.apk')) + '```\n\n')
              summary.write('Download the final `android-public-…` artifact and extract it. Verify every file and both APK attestations:\n\n```bash\nsha256sum -c SHA256SUMS\n')
              for name in ['wallet-review-unsigned.apk', 'wallet-release.apk']:
                  summary.write(f'gh attestation verify {name} --repo {repo} --signer-workflow {repo}/.github/workflows/android-build.yml --signer-digest {commit} --source-ref refs/heads/main --source-digest {commit} --deny-self-hosted-runners\n')
              summary.write('```\n\nOn macOS, use `shasum -a 256 -c SHA256SUMS`. See the repository build guide for offline verification and limits.\n')
          PY
      - name: Upload final APKs, checksums and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-public-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-apk/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  release:
    needs: [build, release-sign, attest]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Publishing credentials never reach app source, npm, Gradle or signing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-public-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-input
          digest-mismatch: error
      - name: Verify release inventory and prepare signed prerelease
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, zipfile
          base = pathlib.Path(os.environ['RUNNER_TEMP'])
          source = base / 'release-input'
          output = base / 'release-output'
          repo, commit = os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']
          run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          if os.environ['GITHUB_REF'] != 'refs/heads/main' or not re.fullmatch('[a-f0-9]{40}', commit) or not re.fullmatch('[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo) or not re.fullmatch('[1-9][0-9]*', run_id) or not re.fullmatch('[1-9][0-9]*', attempt):
              raise SystemExit('Invalid release context')
          def digest(file):
              if file.is_symlink() or not file.is_file():
                  raise SystemExit('Release files must be regular files')
              hasher = hashlib.sha256()
              with file.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      hasher.update(chunk)
              return hasher.hexdigest()
          digest(source / 'SHA256SUMS')
          inventory = {}
          for line in (source / 'SHA256SUMS').read_text().splitlines():
              match = re.fullmatch(r'([a-f0-9]{64})  (.+)', line)
              if not match:
                  raise SystemExit('Invalid checksum manifest')
              value, name = match.groups()
              relative = pathlib.PurePosixPath(name)
              file = source / name
              if name in inventory or name == 'SHA256SUMS' or relative.is_absolute() or '..' in relative.parts or relative.as_posix() != name or source.resolve() not in file.resolve().parents:
                  raise SystemExit('Unsafe release inventory')
              if digest(file) != value:
                  raise SystemExit('Release checksum mismatch')
              inventory[name] = value
          actual = set()
          for file in source.rglob('*'):
              if file.is_symlink():
                  raise SystemExit('Release symlinks are forbidden')
              if file.is_file():
                  actual.add(file.relative_to(source).as_posix())
          if actual != set(inventory) | {'SHA256SUMS'}:
              raise SystemExit('Release inventory mismatch')
          required = {'wallet-release.apk', 'wallet-review-unsigned.apk', 'provenance.jsonl', 'build-info.json', 'sign-info.json', 'source-manifest.json', 'verification.json', 'wallet-release.apk.json', 'android-signing-policy.json', 'android-release-certificate.der', 'LICENSE', 'THIRD_PARTY_NOTICES.md'}
          if not required <= set(inventory):
              raise SystemExit('Release evidence missing')
          build = json.loads((source / 'build-info.json').read_text())
          sign = json.loads((source / 'sign-info.json').read_text())
          proof = json.loads((source / 'wallet-release.apk.json').read_text())
          expected = {'repository': repo, 'ref': 'refs/heads/main', 'commit': commit, 'runId': run_id, 'runAttempt': attempt}
          for metadata in [build, sign]:
              if any(metadata.get(key) != value for key, value in expected.items()):
                  raise SystemExit('Release source context mismatch')
          if build.get('productionSigning') is not False or sign.get('productionSigning') is not True or proof.get('productionSigning') is not True:
              raise SystemExit('Release signing mode mismatch')
          policy = json.loads((source / 'android-signing-policy.json').read_text())
          pinned = os.environ['RELEASE_CERTIFICATE_SHA256']
          source_files = json.loads((source / 'source-manifest.json').read_text())['files']
          if not re.fullmatch('[a-f0-9]{64}', pinned) or policy.get('certificateSha256') != pinned or proof.get('certificateSha256') != pinned or inventory['android-release-certificate.der'] != pinned or sign.get('signingPolicySha256') != inventory['android-signing-policy.json'] or proof.get('signingPolicySha256') != sign.get('signingPolicySha256') or source_files.get('android-signing-policy.json') != inventory['android-signing-policy.json'] or source_files.get('docs/android-release-certificate.der') != pinned:
              raise SystemExit('Release certificate policy mismatch')
          signed_hash, unsigned_hash = inventory['wallet-release.apk'], inventory['wallet-review-unsigned.apk']
          if build.get('sha256') != unsigned_hash or build.get('sourceManifestSha256') != inventory['source-manifest.json'] or sign.get('sha256') != signed_hash or sign.get('unsignedSha256') != unsigned_hash or proof.get('signedSha256') != signed_hash or proof.get('unsignedSha256') != unsigned_hash or proof.get('signatureVerified') is not True or proof.get('alignment16KbVerified') is not True or not re.fullmatch('[a-fA-F0-9]{64}', proof.get('certificateSha256', '')) or sign.get('certificateSha256') != proof.get('certificateSha256'):
              raise SystemExit('Release APK or signature evidence mismatch')
          output.mkdir()
          archive = output / 'android-release-evidence.zip'
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_STORED) as bundle:
              for name in sorted(actual):
                  bundle.write(source / name, name)
          tag = f'android-prerelease-{commit}-{run_id}-{attempt}'
          run_url = f'https://github.com/{repo}/actions/runs/{run_id}/attempts/{attempt}'
          notes = f'''## Android 预发布测试版 / Android test prerelease

          本 APK 使用固定正式证书，在独立离线环境签名，作为预发布版提供测试。同一证书签名的后续版本可覆盖升级；之前的临时测试证书安装不能直接覆盖。尚未进行真机运行测试。

          - Source / 源码提交: [{commit}](https://github.com/{repo}/tree/{commit})
          - Build / 公开构建记录: {run_url}
          - 流程：离线原生编译、独立正式签名、GitHub 来源证明。
          - APK SHA256: `{signed_hash}`
          - Certificate SHA256: `{pinned}`
          - Evidence ZIP SHA256: `{digest(archive)}`

          下载 `wallet-release.apk` 安装测试。`android-release-evidence.zip` 包含原样 APK、未签名 APK、完整 SHA256 清单、来源证明、构建日志和第三方声明。
          解压证据 ZIP 后执行 `sha256sum -c SHA256SUMS`，macOS 使用 `shasum -a 256 -c SHA256SUMS`。

          ```bash
          gh attestation verify wallet-release.apk --bundle provenance.jsonl --repo {repo} --signer-workflow {repo}/.github/workflows/android-build.yml --signer-digest {commit} --source-ref refs/heads/main --source-digest {commit} --deny-self-hosted-runners
          ```
          '''
          # Dedent the workflow's multiline note without modifying the evidence.
          notes = '\n'.join(line.strip() for line in notes.splitlines()) + '\n'
          (output / 'notes.md').write_text(notes)
          names = ['wallet-release.apk', 'SHA256SUMS', 'provenance.jsonl', 'build-info.json', 'sign-info.json', 'source-manifest.json', 'android-signing-policy.json', 'android-release-certificate.der']
          assets = [{'path': str(source / name), 'name': name, 'sha256': digest(source / name)} for name in names]
          assets.append({'path': str(archive), 'name': archive.name, 'sha256': digest(archive)})
          (output / 'plan.json').write_text(json.dumps({'repository': repo, 'commit': commit, 'tag': tag, 'title': f'Android 测试版 {commit[:7]} · build {run_id}.{attempt}', 'notes': str(output / 'notes.md'), 'assets': assets}))
          PY
      - name: Verify GitHub provenance before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in wallet-release.apk wallet-review-unsigned.apk build-info.json sign-info.json source-manifest.json; do
            gh attestation verify "$RUNNER_TEMP/release-input/$name" \
              --bundle "$RUNNER_TEMP/release-input/provenance.jsonl" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/android-build.yml" \
              --signer-digest "$GITHUB_SHA" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Upload verified assets then publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-output'
          plan = json.loads((output / 'plan.json').read_text())
          repo, tag = plan['repository'], plan['tag']
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)
          tag_endpoint = f'repos/{repo}/git/ref/tags/{tag}'
          # This exact source tag was reserved before compilation. Never move it
          # or create a different tag after the source branch has advanced.
          reference = json.loads(gh('api', tag_endpoint))
          if reference['object']['type'] != 'commit' or reference['object']['sha'] != plan['commit']:
              raise SystemExit('Release source tag mismatch')
          def find_release():
              # The by-tag endpoint excludes drafts. List with write access,
              # then use the release ID through upload and publication.
              pages = json.loads(gh('api', '--paginate', '--slurp', f'repos/{repo}/releases?per_page=100'))
              matching = [item for page in pages for item in page if item['tag_name'] == tag]
              if len(matching) > 1:
                  raise SystemExit('Ambiguous release tag')
              return matching[0] if matching else None
          release = find_release()
          if release is None:
              gh('release', 'create', tag, '--repo', repo, '--verify-tag', '--target', plan['commit'], '--title', plan['title'], '--notes-file', plan['notes'], '--draft', '--prerelease', '--latest=false')
              release = find_release()
          if release is None:
              raise SystemExit('Created release was not found')
          endpoint = f'repos/{repo}/releases/{release["id"]}'
          if release['target_commitish'] != plan['commit'] or not release['prerelease']:
              raise SystemExit('Refusing to replace a different release')
          if release['draft']:
              gh('release', 'upload', tag, '--repo', repo, *[asset['path'] for asset in plan['assets']], '--clobber')
          release = json.loads(gh('api', endpoint))
          expected = {asset['name']: 'sha256:' + asset['sha256'] for asset in plan['assets']}
          actual = {asset['name']: asset.get('digest') for asset in release['assets']}
          if actual != expected:
              raise SystemExit('Uploaded release asset digest mismatch; draft left unpublished')
          if release['draft']:
              gh('release', 'edit', tag, '--repo', repo, '--draft=false', '--prerelease', '--latest=false')
          release = json.loads(gh('api', endpoint))
          reference = json.loads(gh('api', f'repos/{repo}/git/ref/tags/{tag}'))
          if release['draft'] or not release['prerelease'] or reference['object']['type'] != 'commit' or reference['object']['sha'] != plan['commit']:
              raise SystemExit('Published release or source tag mismatch')
          (output / 'published.json').write_text(json.dumps({'url': release['html_url'], 'tag': tag, 'commit': plan['commit'], 'prerelease': True, 'assets': expected}))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"### Android test prerelease\n\n[Download verified APK and evidence]({release['html_url']})\n\n")
          print(release['html_url'])
          PY
