name: iOS IPA
run-name: iOS ${{ inputs.distribution }} build ${{ inputs.build_number }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: 'Ad Hoc for registered devices; App Store Connect for TestFlight'
        required: true
        type: choice
        default: ad-hoc
        options: [ad-hoc, app-store-connect]
      build_number:
        description: 'Integer greater than every previous iOS build (including EAS builds)'
        required: true
        type: string
      upload_to_testflight:
        description: 'Upload to TestFlight (App Store Connect distribution only)'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-ipa
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
  IOS_BUILD_NUMBER: ${{ inputs.build_number }}
  IOS_DISTRIBUTION: ${{ inputs.distribution }}
  CI: '1'
  EXPO_NO_DOTENV: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - name: Validate build request and toolchain before installing dependencies
        run: python3 scripts/github-ios.py prepare
      - name: Verify sources, install locked dependencies and run checks
        run: |
          token="$(openssl rand -hex 24)"
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          npm run check:source
          npm run install:safe
          npm test -- --runInBand
          npm run typecheck
          # Validate against the locked SDK's bundled matrix, as in Main tests.
          EXPO_OFFLINE=1 ./node_modules/.bin/expo install --check
      - name: Generate native project and build unsigned archive without Apple credentials
        run: |
          token="$(openssl rand -hex 24)"
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          python3 scripts/github-ios.py build
      - name: Preserve unsigned archive and build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: exports/github-ios-unsigned/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build-failed-${{ github.run_id }}-${{ github.run_attempt }}
          path: exports/github-ios-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Clean generated build files and dependency installation
        if: always()
        run: python3 scripts/github-ios.py cleanup-build

  sign:
    needs: build
    environment: ios-production-signing
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Fresh VM. No app sources, npm packages, Pods or build phase scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/github-ios.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: exports/github-ios-input
          digest-mismatch: error
      - name: Verify archive, import temporary signing identity and export IPA
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          IOS_AD_HOC_PROFILE_BASE64: ${{ secrets.IOS_AD_HOC_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: python3 scripts/github-ios.py sign
      - name: Preserve signed IPA, dSYMs and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: exports/github-ios-signed/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Remove temporary keychain and provisioning profile
        if: always()
        run: python3 scripts/github-ios.py cleanup

  upload:
    needs: sign
    if: inputs.distribution == 'app-store-connect' && inputs.upload_to_testflight
    environment: ios-testflight
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/github-ios.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: exports/github-ios-signed
          digest-mismatch: error
      - name: Validate IPA and upload using App Store Connect API authentication
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: python3 scripts/github-ios.py upload
      - name: Preserve upload receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-upload-${{ github.run_id }}-${{ github.run_attempt }}
          path: exports/github-ios-upload/
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary API key
        if: always()
        run: python3 scripts/github-ios.py cleanup
