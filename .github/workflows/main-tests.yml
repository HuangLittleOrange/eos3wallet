name: Main tests
run-name: Tests for main @ ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
      - name: Test and typecheck in credential-free containers
        run: |
          token="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(24).toString("hex"))')"
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          node scripts/isolated-build.cjs --tests-only
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: main-tests-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            exports/isolated-review/*/tests.txt
            exports/isolated-review/*/typecheck.txt
            exports/isolated-review/*/expo-check.txt
            exports/isolated-review/*/python-version.txt
            exports/isolated-review/*/registry-signatures.json
            exports/isolated-review/*/verification.json
            exports/isolated-review/*/source-manifest.json
          if-no-files-found: warn
          retention-days: 14
